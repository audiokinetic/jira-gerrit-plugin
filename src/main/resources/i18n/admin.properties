gerrit.admin.label=Gerrit Settings

gerrit.admin.ssh.label=SSH Connection
gerrit.admin.host.label=SSH Host
gerrit.admin.host.description=Example: gerrit.company.com
gerrit.admin.port.label=SSH Port
gerrit.admin.port.description=Example: 29418
gerrit.admin.username.label=SSH Username
gerrit.admin.username.description=Example: jira
gerrit.admin.sshKey.label=SSH Private Key
gerrit.admin.sshKey.description=Example: id_rsa file
gerrit.admin.sshKey.isOnFile=Private Key is already on file. Upload a new one to replace it.
gerrit.admin.sshKey.missing=A private key is required!

gerrit.admin.search.label=Search Queries
gerrit.admin.issueSearchQuery.label=Issue Search
gerrit.admin.issueSearchQuery.description=Enter a search query used to locate reviews for a given issue (via gerrit query [...]). Use "%s" as a placeholder for the issue key.  To reference the issue key multiple times in the query, use "%1$s" instead.  \
                                          Examples: "tr:%s"; "topic:%s"; "message:%s"; "tr:%s OR topic:%1$s"; etc.
gerrit.admin.projectSearchQuery.label=Project Search
gerrit.admin.projectSearchQuery.description=Enter a search query used to locate reviews for a given project (via gerrit query [...]). Use "%s" or "%1$s" as a placeholder for the project key.  \
                                            Examples: project:%s, topic:%s, or message:%s-*.

## Not yet implemented (JSON-RPC):
gerrit.admin.http.label=HTTP Settings (optional)
gerrit.admin.httpBaseUrl.label=HTTP Base URL
gerrit.admin.httpBaseUrl.description=Example: http://gerrit.company.com/
gerrit.admin.httpUsername.label=HTTP Username
gerrit.admin.httpUsername.description=Example: jira
gerrit.admin.httpPassword.label=HTTP Password

gerrit.admin.project.settings=Project Settings
gerrit.admin.showEmptyPanel.label=Show Gerrit Reviews panel even if there are no reviews
gerrit.admin.showEmptyPanel.description=If there are no matching Gerrit reviews for the issue, the panel will still display with a note that nothing matches. \
                                        Uncheck this box to remove the panel instead.
gerrit.admin.project.whitelist=Gerrit Projects Whitelist
gerrit.admin.project.whitelist.description=List of projects, that use gerrit.
gerrit.admin.project.useWhiteList.label=Use Gerrit Project Whitelist
gerrit.admin.project.useWhiteList.description=If a list of projects, that use Gerrit, shall be maintained.

gerrit.admin.cache.label=Review Cache
gerrit.admin.cache.enabled.label=Enable Review Cache
gerrit.admin.cache.enabled.description=When checked (default), review results are cached for better performance. Uncheck to query Gerrit directly on every request (useful for debugging or when real-time accuracy is required). Cache size and TTL settings below are ignored when caching is disabled.
gerrit.admin.cache.maxEntries.label=Max Cache Entries
gerrit.admin.cache.maxEntries.description=Maximum number of issue keys to keep in the review cache. Changes take effect immediately when saved.
gerrit.admin.cache.expireOnIdle.label=Cache Expiry Strategy
gerrit.admin.cache.expireOnIdle.tti=Time-to-Idle (TTI) — reset expiry on each access
gerrit.admin.cache.expireOnIdle.ttl=Time-to-Live (TTL) — fixed expiry from write
gerrit.admin.cache.expireOnIdle.label2=Time-to-Idle (TTI)
gerrit.admin.cache.expireOnIdle.description=When checked (default), the expiry timer resets on every cache access (expireAfterAccess). Uncheck to use Time-to-Live (TTL) where entries expire a fixed duration after being written regardless of access (expireAfterWrite).
gerrit.admin.cache.expireMinutes.label=Cache TTL/TTI (minutes)
gerrit.admin.cache.expireMinutes.description=Number of minutes after last access before a cache entry expires. Changes take effect immediately when saved.
gerrit.admin.cache.clearCache.label=Clear Cache Now
gerrit.admin.cache.clearCache.description=Immediately removes all cached review data. The cache will be repopulated on the next issue view.
gerrit.admin.cache.flushed=The Gerrit reviews cache has been cleared successfully.
